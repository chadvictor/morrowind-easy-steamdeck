name: Check installer
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and exercise the native controller helper
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev
          bash scripts/build-native.sh
      - name: Select the helper for source-tree tests
        run: echo "MES_NATIVE_LIBRARY=$GITHUB_WORKSPACE/dist/libmes-controller-text.so" >> "$GITHUB_ENV"
      - name: Check shell syntax and static analysis
        run: |
          for script in lib/*.sh src/*.sh scripts/*.sh tests/*.sh; do bash -n "$script"; done
          shellcheck -x -e SC1091 lib/*.sh src/*.sh scripts/*.sh tests/*.sh
      - name: Exercise Steam discovery and reversible edits
        run: bash tests/test-steam.sh
      - name: Exercise profiles and launcher with a simulated Flatpak
        run: bash tests/test-core.sh
      - name: Exercise the player connection menu
        run: |
          bash tests/test-menu.sh
          bash tests/test-connect.sh
      - name: Verify the real PT-BR package and optional integration
        run: bash tests/test-translation.sh
      - name: Check the controller contract
        run: python3 tests/test-profile.py
      - name: Build and check the standalone release
        run: |
          bash scripts/package.sh
          bash dist/install-morrowind.sh --help
          bash dist/install-morrowind.sh --version
          cd dist
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/
