    </g>
    <circle cx="758" cy="176" r="25" fill="#0d151b" stroke="#51615f" stroke-width="2"/><circle cx="758" cy="176" r="15" fill="#263238"/>
    <path d="M748 220h20v14h14v20h-14v14h-20v-14h-14v-20h14Z" fill="#091217" stroke="#4c5b5a"/>
    <rect x="735" y="291" width="46" height="36" rx="6" fill="#1f2d32" stroke="#425453"/><rect x="1142" y="291" width="46" height="36" rx="6" fill="#1f2d32" stroke="#425453"/>
    <circle cx="1163" cy="252" r="24" fill="#0d151b" stroke="#51615f" stroke-width="2"/><circle cx="1163" cy="252" r="15" fill="#263238"/>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">
      <circle cx="1163" cy="149" r="12" fill="#24363a"/><text x="1163" y="153" fill="#e1c778">Y</text>
      <circle cx="1187" cy="174" r="12" fill="#24363a"/><text x="1187" y="178" fill="#df9896">B</text>
      <circle cx="1139" cy="174" r="12" fill="#24363a"/><text x="1139" y="178" fill="#93bbdf">X</text>
      <circle cx="1163" cy="199" r="12" fill="#24363a"/><text x="1163" y="203" fill="#94d4ae">A</text>
    </g>
