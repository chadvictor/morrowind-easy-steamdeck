      <circle cx="69" cy="60" r="4" fill="#87c7ba"/>
      <text x="82" y="64" font-size="11" font-weight="600" letter-spacing="1.8" fill="#a4d7cb">RETURN TO VVARDENFELL</text>
      <text x="48" y="164" font-size="76" font-weight="700" letter-spacing="-3" fill="#f3eee4">Morrowind</text>
      <text x="52" y="218" font-size="37" font-weight="400" letter-spacing="1" fill="#d8b47c">Easy Steam Deck</text>
      <text x="54" y="282" font-size="27" fill="#f3eee4">A whole world. From your couch.</text>
      <text x="54" y="318" font-size="19" fill="#aabbbc">Your Steam copy, with the comforts of a handheld.</text>
      <g font-size="13" font-weight="600" fill="#cfe3de">
        <rect x="54" y="355" width="170" height="37" rx="9" fill="#203438" stroke="#34514f"/><text x="139" y="379" text-anchor="middle">CONTROLLER MENUS</text>
        <rect x="235" y="355" width="177" height="37" rx="9" fill="#203438" stroke="#34514f"/><text x="323.5" y="379" text-anchor="middle">IN-GAME KEYBOARD</text>
        <rect x="423" y="355" width="142" height="37" rx="9" fill="#203438" stroke="#34514f"/><text x="494" y="379" text-anchor="middle">OPTIONAL PT-BR</text>
      </g>
      <text x="54" y="451" font-size="12" letter-spacing="2" fill="#79908e">ONE DOWNLOAD</text><circle cx="204" cy="447" r="2" fill="#79908e"/>
      <text x="220" y="451" font-size="12" letter-spacing="2" fill="#79908e">NO ADMIN PASSWORD</text>
      <text x="1224" y="451" text-anchor="end" font-size="11" letter-spacing="2" fill="#79908e">COMMUNITY PREVIEW</text>
    </g>
    <!-- Original illustration. The display is artwork, not a gameplay capture. -->
    <ellipse cx="962" cy="371" rx="267" ry="29" fill="#070e13" opacity=".55"/>
    <path d="M770 107h377c38 0 69 35 69 80v119c0 36-20 60-48 60-17 0-34-14-45-33H798c-12 19-29 33-47 33-28 0-48-24-48-60V187c0-45 29-80 67-80Z" fill="#172127" stroke="#4c5b5a" stroke-width="3"/>
    <rect x="804" y="121" width="310" height="216" rx="14" fill="#080f14" stroke="#3c494b"/>
