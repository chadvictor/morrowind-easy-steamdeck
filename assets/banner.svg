<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="490" viewBox="0 0 1280 490" role="img" aria-labelledby="title desc">
  <title id="title">Morrowind Easy Steam Deck</title>
  <desc id="desc">Return to Vvardenfell, from your couch. An original handheld and volcanic island illustration. Controller menus, an in-game keyboard and optional PT-BR.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#13252a"/><stop offset=".6" stop-color="#111b23"/><stop offset="1" stop-color="#29242b"/></linearGradient>
    <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#334e54"/><stop offset="1" stop-color="#c49b72"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#dfb57a" stop-opacity=".22"/><stop offset="1" stop-color="#dfb57a" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="1280" height="490" rx="24"/></clipPath>
    <clipPath id="display"><rect x="816" y="133" width="286" height="192" rx="9"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="490" fill="url(#bg)"/>
    <circle cx="1090" cy="205" r="350" fill="url(#glow)"/>
    <path d="M0 452C260 365 408 471 650 405S1020 428 1280 354v136H0Z" fill="#0b151b"/>
    <path d="M728 122c70-66 187-80 267-29s154 73 256 22M712 97c86-79 204-83 293-29s155 67 275 26" fill="none" stroke="#87c7ba" stroke-opacity=".10" stroke-width="2"/>
    <path d="M692 370c118-57 195 31 316-11s196-9 288 12" fill="none" stroke="#d8b47c" stroke-opacity=".18"/>
    <g font-family="Segoe UI,Arial,sans-serif">
